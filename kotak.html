<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat Kotak HTML</title>
    <style>
        /* Gaya dasar halaman */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        /* Codingan Utama untuk Membuat Kotak */
        .kotak-simpel {
            width: 200px;             /* Lebar kotak */
            height: 200px;            /* Tinggi kotak */
            background-color: #3498db; /* Warna biru */
            
            /* Variasi kosmetik (opsional) */
            border: 3px solid #2980b9; /* Garis tepi */
            border-radius: 8px;        /* Sudut kotak agak melengkung */
            
            /* Mengatur teks di dalam kotak agar pas di tengah */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Elemen kotak di HTML -->
    <div class="kotak-simpel">
        Ini Kotak
    </div>

</body>
</html>

<!DOCTYPE html>

    <style>
        /* Membuat kotak berada di tengah layar */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Membuat elemen kotak dan teks di tengah kotak */
        .kotak-simpel {
            width: 200px;
            height: 200px;
            background-color: #3498db;
            color: white;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="kotak-simpel">
        Ini Kotak
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <title>Simpel Layar</title>
    <style>
        body {
            /* Membuat semua konten otomatis berada di tengah layar */
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        
        hr {
            width: 100%; /* Garis penuh dari kanan ke kiri */
            border: 2px solid blue; /* Ketebalan dan warna garis */
        }
    </style>
</head>
<body>

    <h1>Teks di Tengah</h1>
    <hr>
    <p>Ini teks bawah</p>

</body>
</html>
