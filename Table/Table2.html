<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tabel</title>
</head>

<body>

<table border="1" cellspacing="5" cellpadding="15">
    <tr>
        <td colspan="5">1</td>
        <td rowspan="3">2</td>
        <td colspan="4">3</td>
        <td rowspan="3">N</td>
    </tr>

    <tr>
        <td>4</td>
        <td>5</td>
        <td>6</td>
        <td colspan="2"></td>
        <td>7</td>
        <td>8</td>
    </tr>

    <tr>
        <td colspan="5">9</td>
        <td colspan="2">10</td>
    </tr>

    <tr>
        <td colspan="11">N</td>
    </tr>

    <tr>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td>N</td>
        <td colspan="4"></td>
    </tr>

</table>

</body>
</html>
