<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel</title>
</head>

<body>

<p>Tabel 1</p>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Fname</th>
        <th>City</th>
        <th>Age</th>
    </tr>
    <tr>
        <td>Aceng</td>
        <td>Godin</td>
        <td>Rongge</td>
        <td>16 th</td>
    </tr>
    <tr>
        <td>Asep</td>
        <td>Strawberry</td>
        <td>Lembang</td>
        <td>70 th</td>
    </tr>
</table>

<br>

<p>Tabel 2</p>

<table border="1">
    <tr>
        <th rowspan="2">Table format:XY</th>
        <th colspan="2">X</th>
        <th colspan="3">Group A</th>
    </tr>
    <tr>
        <th>Minutes</th>
        <th>Test group X</th>
        <th colspan="3">Test group A</th>
    </tr>
    <tr>
        <th></th>
        <th>X</th>
        <th>Y</th>
        <th>A:Y1</th>
        <th>A:Y2</th>
        <th>A:Y3</th>
    </tr>
</table>

</body>
</html>
