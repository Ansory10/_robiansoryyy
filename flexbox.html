!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh CSS Flexbox</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }

        
        .flex-container {
            display: flex;             
            flex-direction: row;       
            justify-content: space-around; 
            align-items: center;       
            flex-wrap: wrap;           
            
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 8px;
            min-height: 200px;
        }

        /* 2. FLEX ITEMS (Anak) */
        .flex-item {
            background-color: #3498db;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            margin: 10px;
            width: 100px;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h2>Contoh Layout CSS Flexbox</h2>
    <p>Coba perkecil ukuran browser Anda untuk melihat sifat responsifnya!</p>

    <!-- Struktur HTML Flexbox -->
    <div class="flex-container">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
        <div class="flex-item">4</div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh CSS Flexbox Simpel</title>
    <style>
        /* CSS UTAMA FLEXBOX (Sangat Simpel) */
        .flex-container {
            display: flex;         /* Mengaktifkan flexbox */
            justify-content: space-around; /* Jarak merata horizontal */
            background: #ddd;      /* Warna latar belakang biar kelihatan */
            padding: 10px;
        }

        .flex-item {
            background: #3498db;   /* Warna kotak */
            color: white;          /* Warna teks */
            padding: 20px;         /* Ukuran dalam kotak */
            width: 50px;           /* Lebar kotak */
            text-align: center;    /* Teks di tengah */
        }
    </style>
</head>
<body>

    <h2>Contoh Layout CSS Flexbox</h2>

    <div class="flex-container">
        <div class="flex-item">1</div>
        <div class="flex-item">2</div>
        <div class="flex-item">3</div>
        <div class="flex-item">4</div>
    </div>

</body>
</html>
